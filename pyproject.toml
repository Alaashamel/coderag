[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "coderag"
version = "0.1.0"
description = "A retrieval-augmented Q&A assistant for codebases."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Alaa Shamel" }]
dependencies = [
    "scikit-learn>=1.3",
    "click>=8.1",
    "fastapi>=0.104",
    "uvicorn>=0.24",
    "pydantic>=2.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.4", "httpx>=0.25"]

[project.scripts]
coderag = "coderag.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
